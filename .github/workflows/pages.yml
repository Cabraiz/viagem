name: Publish viagem (rooms Worker + frontend)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm ci --prefix backend
      # scripts/normalizar-quadros.py (card troca-de-perna): the per-frame scale gate of the hero sheets runs in Python,
      # as in ci.yml; without numpy/pillow `npm test` fails here and nothing is published.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - run: npm run check && npm test && npm run build
      # Full-size protocol run (6 clients, 10 s without area of interest; ~1 GB). Too heavy for the shared PC's
      # `npm test`, so only CI runs it: the wide-map 32 KB/s budget has a ~60 B/s margin that 2 clients cannot see.
      - run: npm run test:protocol:stress
      # Production smoke (D-049, Executor-8 scripts/smoke-prod.mjs): the built dist/ under vite preview + the local rooms
      # Worker; headless Chromium plays "Jogar sozinho" (normal and ?modo=chaveiro). A failure here fails `build`, so
      # nothing is published: it catches bundle-only breakage (e5b34e5: a chunk cycle left top-level constants undefined).
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}
      - run: npm install --no-save playwright@1.63.0
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Production smoke (1 = game broken, blocks; 2 = infra, retried once, then blocks)
        run: |
          set +e
          node scripts/smoke-prod.mjs smoke-out; code=$?
          if [ "$code" -eq 2 ]; then echo "::warning::smoke infra error (exit 2), retrying once"; node scripts/smoke-prod.mjs smoke-out; code=$?; fi
          exit $code
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 7
          if-no-files-found: ignore
      - name: dist/multiplayer.json is the production one (the smoke points it at a local Worker and must restore it)
        run: |
          cmp public/multiplayer.json dist/multiplayer.json || { echo "::error::dist/multiplayer.json differs from public/multiplayer.json"; exit 1; }
          node -e "const m=require('./dist/multiplayer.json');if(!/^https:\/\//.test(m.endpoint)||/localhost|127\.0\.0\.1/.test(m.endpoint)){console.error('::error::endpoint '+m.endpoint);process.exit(1)}console.log('endpoint '+m.endpoint)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # The client and the rooms Worker speak the same room protocol, so the Worker
  # goes first and the frontend is only published if the live Worker speaks the
  # protocol in public/multiplayer.json.
  # With the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare
  # Workers"; plus CLOUDFLARE_ACCOUNT_ID if the token sees more than one account)
  # the Worker is deployed here. Without it the Worker is deployed from the
  # orchestrator's PC (`npm run deploy:rooms`, logged-in wrangler) and this job only
  # checks that the live Worker already matches, so pushes publish the site instead
  # of failing on the missing secret.
  deploy-rooms:
    needs: build
    runs-on: ubuntu-latest
    # Waits up to 30 min for an empty room (deploy-rooms.mjs --wait 30): 45 min stops a stuck checkout (20/10: 20 min).
    timeout-minutes: 45
    environment:
      name: cloudflare-workers
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # health-gate.mjs diffs the live Worker's build against this commit: the whole history, trees only.
          fetch-depth: 0
          filter: blob:none
      - name: Expected room protocol
        id: proto
        run: echo "n=$(node -p "require('./public/multiplayer.json').protocol")" >> "$GITHUB_OUTPUT"
      - name: Token available?
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "has=true" >> "$GITHUB_OUTPUT"
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::Sem CLOUDFLARE_API_TOKEN: o Worker não é publicado aqui; só confiro se o que está no ar já fala o protocolo ${{ steps.proto.outputs.n }}."; fi
      - uses: actions/setup-node@v7
        if: steps.token.outputs.has == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
        if: steps.token.outputs.has == 'true'
      - name: Deploy rooms Worker
        if: steps.token.outputs.has == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Waits (up to 30 min: the city's 25 min combat cap plus the countdown) for no room to be in a match, since a
        # deploy restarts them all; still busy, it skips the deploy and the next step decides whether the site may go.
        run: node scripts/deploy-rooms.mjs --wait 30 --skip-if-busy
      - name: Live Worker matches the site (protocol, maps AND build; never publish the site out of step with the Worker)
        # scripts/health-gate.mjs: /health's protocol and maps (version + hash) against public/multiplayer.json and
        # public/maps/*.manifest.json, and its build against this commit (nothing the Worker bundles may have changed
        # since: scripts/worker-files.mjs), asked a few times (a fresh deploy takes seconds to reach every edge).
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://viagem-salas.viagem.workers.dev/)
          echo "rooms Worker answered $code"
          test "$code" -lt 500
          node scripts/health-gate.mjs https://viagem-salas.viagem.workers.dev/health --tries 6 --wait 10
  deploy:
    needs: [build, deploy-rooms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
