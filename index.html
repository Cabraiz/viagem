<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B3F8C" />
    <meta name="description" content="Monte sua turma. Escolha entre 36 classes de uma aventura cooperativa fora do comum." />
    <link rel="icon" href="/favicon.svg" />
    <!-- DSG-fontes: só os 2 pesos mais usados vão no preload; o resto chega com font-display:swap. -->
    <link rel="preload" href="/fonts/londrina-solid-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/m-plus-rounded-1c-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- danca-sem-fallback: the first page of the selected hero's dance (menu-dance.ts firstDancePage) starts downloading
         with the HTML, before the bundle and the art index, so the menu's empty podium turns into the dance sooner.
         DEFAULT_HERO = playableClasses[0] (tests/client/menu-dance.test.ts checks it). -->
    <!-- menu-estadio: the stadium behind the menu (estadio.css), on screen from the first frame; the file the CSS picks. -->
    <link rel="preload" href="/art/ui-extra/estadio-1920.webp" as="image" fetchpriority="high" media="(min-width: 1100px)" />
    <link rel="preload" href="/art/ui-extra/estadio-1280.webp" as="image" fetchpriority="high" media="(max-width: 1099px) and (orientation: landscape), (min-width: 821px) and (max-width: 1099px)" />
    <link rel="preload" href="/art/ui-extra/estadio-retrato-768.webp" as="image" fetchpriority="high" media="(orientation: portrait) and (max-width: 820px)" />
    <script>
      (function(){var DEFAULT_HERO='mendigo',id=DEFAULT_HERO;
        try{if(/[?&]sandbox=/.test(location.search))return;var s=JSON.parse(localStorage.getItem('viagem:hero:v1')||'null');if(s&&typeof s.classId==='string'&&/^[a-z0-9-]{1,40}$/.test(s.classId))id=s.classId;}catch(e){}
        var l=document.createElement('link');l.rel='preload';l.as='image';l.href='/art/lite/menu/danca/'+id+'-p1.webp';l.setAttribute('fetchpriority','high');document.head.appendChild(l);})();
    </script>
    <title>viagem: crie seu personagem</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
