# Suite for executor branches (NEW-20261014-ORQ-ci-github-shards-e-bench, D-049 item 1). Publishing stays in pages.yml.
# The executor reads the result with `node tools/ci.mjs test <branch>` (no token needed: public repo):
# every test shard leaves one annotation `ci-ok` or `ci-failed` (JSON list of failing test files) plus `ci-timings`.
# Shards are balanced by tests/.timings.json (longest first into the lightest shard; refresh it with
# `node tools/ci.mjs timings <branch>`).
name: CI
on:
  push:
    branches: ['vgm/**', 'fila/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  # The PC's node: bench determinism and the same type stripping as local runs.
  NODE_VERSION: '26.9.0'
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
          lookup-only: true
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --include=optional && npm ci --prefix backend

  check:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --include=optional && npm ci --prefix backend
      - run: npm run check

  build:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --include=optional && npm ci --prefix backend
      - id: build
        run: npm run build
      # Production smoke (Executor-8, scripts/smoke-prod.mjs): the built dist/ under vite preview + the local rooms
      # Worker; headless Chromium plays "Jogar sozinho" (normal and ?modo=chaveiro). Catches bundle-only breakage
      # (e.g. chunk cycles leaving top-level constants undefined) that check/test/build cannot see.
      - id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}
      - run: npm install --no-save playwright@1.63.0
      - if: steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Production smoke (1 = game broken, blocks; 2 = infra, retried once, then blocks)
        id: smoke
        run: |
          set +e
          mkdir -p smoke-out
          node scripts/smoke-prod.mjs smoke-out 2>&1 | tee smoke-out/smoke.log; code=${PIPESTATUS[0]}
          if [ "$code" -eq 2 ]; then echo "::warning::smoke infra error (exit 2), retrying once"; node scripts/smoke-prod.mjs smoke-out 2>&1 | tee -a smoke-out/smoke.log; code=${PIPESTATUS[0]}; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      # The verdict for the queue (`fila lote --smoke ci` → `tools/ci.mjs test --smoke`): annotation smoke-prod and
      # smoke-out/smoke-prod.json, at most 10 lines. Also when the build or the smoke step failed (a red build is the game's).
      - name: Smoke summary (smoke-prod)
        if: always()
        run: node tools/ci.mjs smoke-note prod smoke-out/smoke.log --exit "${{ steps.smoke.outputs.code }}" --build "${{ steps.build.outcome }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 7
          if-no-files-found: ignore

  # The returning player's smoke (BUG-20261014-ORQ-mapa-cache-velho), on the queue's batch branches only: the base (the
  # main the batch was made on: merge-base with origin/main) built in ../anterior, then scripts/smoke-prod.mjs
  # --upgrade-from it (one browser profile plays the old build, then this one). The PC ran it in every lote; with
  # `fila lote --smoke ci` the queue reads its annotation (smoke-upgrade) instead. continue-on-error: its verdict travels
  # in that annotation, so a red upgrade never turns the run red for a queue that still smokes on the PC (the default).
  smoke-upgrade:
    if: startsWith(github.ref, 'refs/heads/fila/')
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The whole history without blobs: enough for the merge-base, and the base's blobs come on its checkout.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --include=optional && npm ci --prefix backend
      - name: The base (merge-base with origin/main) in ../anterior
        id: base
        run: |
          base=$(git merge-base HEAD origin/main || true)
          if [ -z "$base" ] || [ "$base" = "$(git rev-parse HEAD)" ]; then echo "skip=sem base anterior (merge-base ${base:-nenhum})" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "base $base"; echo "sha=$base" >> "$GITHUB_OUTPUT"
          git worktree add -q --detach ../anterior "$base"
          # Same lockfiles: the same node_modules (the PC's queue links them the same way); else its own npm ci.
          for d in . backend; do
            if git diff --quiet "$base" HEAD -- "$d/package-lock.json"; then ln -s "$PWD/$d/node_modules" "../anterior/$d/node_modules"
            else (cd "../anterior/$d" && npm ci --include=optional); fi
          done
      - id: build
        if: steps.base.outputs.sha != ''
        run: npm run build && (cd ../anterior && npm run build)
      - id: pw
        if: steps.base.outputs.sha != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.63.0-${{ runner.os }}
      - if: steps.base.outputs.sha != ''
        run: npm install --no-save playwright@1.63.0
      - if: steps.base.outputs.sha != '' && steps.pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.base.outputs.sha != '' && steps.pw.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Upgrade smoke (1 = game broken; 2 = infra, retried once)
        id: smoke
        if: steps.base.outputs.sha != ''
        run: |
          set +e
          mkdir -p smoke-upgrade
          node scripts/smoke-prod.mjs smoke-upgrade --upgrade-from ../anterior 2>&1 | tee smoke-upgrade/smoke.log; code=${PIPESTATUS[0]}
          if [ "$code" -eq 2 ]; then echo "::warning::upgrade smoke infra error (exit 2), retrying once"; node scripts/smoke-prod.mjs smoke-upgrade --upgrade-from ../anterior 2>&1 | tee -a smoke-upgrade/smoke.log; code=${PIPESTATUS[0]}; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Smoke summary (smoke-upgrade)
        if: always()
        run: node tools/ci.mjs smoke-note upgrade smoke-upgrade/smoke.log --exit "${{ steps.smoke.outputs.code }}" --build "${{ steps.build.outcome || steps.base.outcome }}" --skipped "${{ steps.base.outputs.skip }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-upgrade
          path: smoke-upgrade
          retention-days: 7
          if-no-files-found: ignore

  test:
    needs: setup
    name: test ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
          key: deps-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json', 'backend/package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --include=optional && npm ci --prefix backend
      # scripts/normalizar-quadros.py (card troca-de-perna): the per-frame scale gate of the hero sheets runs in Python.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow numpy
      - name: Test shard ${{ matrix.shard }}/6
        run: |
          mapfile -t files < <(node tools/ci.mjs shard ${{ matrix.shard }}/6)
          echo "${#files[@]} test files"
          set +e
          node --experimental-strip-types --test --test-concurrency=4 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=./tools/ci-reporter.mjs --test-reporter-destination=ci-report.json \
            "${files[@]}"
          code=$?
          set -e
          node tools/ci.mjs report ci-report.json --shard ${{ matrix.shard }}/6 --exit $code
          exit $code
