name: Publish viagem (rooms Worker + frontend)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - run: npm ci --prefix backend
      - run: npm run check && npm test && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  # The client and the rooms Worker speak the same room protocol, so the Worker
  # goes first and the frontend is only published if the Worker deploy succeeded.
  # Needs the repository secret CLOUDFLARE_API_TOKEN (template "Edit Cloudflare
  # Workers") and, if the token sees more than one account, CLOUDFLARE_ACCOUNT_ID.
  deploy-rooms:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-workers
    steps:
      - name: Require the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN ausente: nada foi publicado (nem salas nem site)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=optional
      - name: Deploy rooms Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config multiplayer/wrangler.jsonc
      - name: Smoke test (origin guard answers, no 5xx)
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://viagem-salas.viagem.workers.dev/)
          echo "rooms Worker answered $code"
          test "$code" -lt 500
  deploy:
    needs: [build, deploy-rooms]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
