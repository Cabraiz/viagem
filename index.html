<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5B3F8C" />
    <!-- seo-natural (NEW-20261023-ORQ-seo-natural, docs/seo.md): English head for people everywhere; the game's own text
         is pt-BR, so <html lang> stays pt-BR and there is no hreflang (no /pt or /es pages). Everything here is true in the
         game: up to six players (protocol/room.ts MAX_PLAYERS), the three open heroes (rules/personagens-liberados.ts).
         tests/tools/seo-head.test.ts keeps the tone rules (no superlatives, no "!", description <= 155). -->
    <meta name="description" content="A free browser game for up to six players. You survive waves of creatures in a city as a gambler, a tired office worker or a hungry cat." />
    <link rel="canonical" href="https://viagem.cyou/" />
    <!-- icone-uno-2b (NEW-20261023-ORQ-icone-uno-2b, docs/seo.md): the 2B logo (the Uno on a snowy V street, 16-bit). The
         .ico carries a hand-drawn 16 px (the reduced one is a smudge); Google's search icon uses the 48/96/192 PNGs. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/icon-48.png" sizes="48x48" />
    <link rel="icon" type="image/png" href="/icon-96.png" sizes="96x96" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="viagem" />
    <meta property="og:url" content="https://viagem.cyou/" />
    <meta property="og:title" content="viagem: co-op survival in the browser" />
    <meta property="og:description" content="A free browser game for up to six players. You survive waves of creatures in a city as a gambler, a tired office worker or a hungry cat." />
    <meta property="og:image" content="https://viagem.cyou/og.jpg?v=2b" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The viagem logo: a snowy city street shaped like a V, with a small boxy car." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="viagem: co-op survival in the browser" />
    <meta name="twitter:description" content="A free browser game for up to six players. You survive waves of creatures in a city as a gambler, a tired office worker or a hungry cat." />
    <meta name="twitter:image" content="https://viagem.cyou/og.jpg?v=2b" />
    <meta name="twitter:image:alt" content="The viagem logo: a snowy city street shaped like a V, with a small boxy car." />
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"VideoGame","name":"viagem","url":"https://viagem.cyou/","image":"https://viagem.cyou/og.jpg?v=2b",
       "description":"A free browser game for up to six players. You survive waves of creatures in a city as a gambler, a tired office worker or a hungry cat.",
       "genre":"Survival","gamePlatform":"Web browser","applicationCategory":"Game","operatingSystem":"Any","inLanguage":"pt-BR",
       "playMode":["SinglePlayer","CoOp"],"numberOfPlayers":{"@type":"QuantitativeValue","minValue":1,"maxValue":6},
       "offers":{"@type":"Offer","price":"0","priceCurrency":"USD","availability":"https://schema.org/InStock"}}
    </script>
    <!-- DSG-fontes: só os 2 pesos mais usados (e a fonte do botão do estádio, abaixo) vão no preload; o resto chega com font-display:swap. -->
    <link rel="preload" href="/fonts/londrina-solid-900.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/m-plus-rounded-1c-700.woff2" as="font" type="font/woff2" crossorigin />
    <!-- fonte-botao-coerente: the stadium's SELECIONAR (Lilita One) is on the first frame; the Londrina 900 stays for the round arrows. -->
    <link rel="preload" href="/fonts/lilita-one-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- danca-sem-fallback: the first page of the selected hero's dance (menu-dance.ts firstDancePage) starts downloading
         with the HTML, before the bundle and the art index, so the menu's empty podium turns into the dance sooner.
         DEFAULT_HERO = PERSONAGEM_PADRAO and OPEN = PERSONAGENS_LIBERADOS (src/rules/personagens-liberados.ts,
         cadeado-so-clt-viciado; tests/client/menu-dance.test.ts checks both): a saved locked hero opens on the default. -->
    <!-- menu-estadio: the stadium behind the menu (estadio.css), on screen from the first frame; the file the CSS picks. -->
    <link rel="preload" href="/art/lite/menu/fundo-estadio-viciado.webp" as="image" fetchpriority="high" media="(orientation: landscape) and (min-height: 521px)" />
    <link rel="preload" href="/art/ui-extra/estadio-1920.webp" as="image" fetchpriority="high" media="(min-width: 1100px) and (orientation: portrait), (min-width: 1100px) and (max-height: 520px)" />
    <link rel="preload" href="/art/ui-extra/estadio-1280.webp" as="image" fetchpriority="high" media="(max-width: 1099px) and (orientation: landscape) and (max-height: 520px), (min-width: 821px) and (max-width: 1099px) and (orientation: portrait)" />
    <link rel="preload" href="/art/ui-extra/estadio-retrato-768.webp" as="image" fetchpriority="high" media="(orientation: portrait) and (max-width: 820px)" />
    <script>
      (function(){var DEFAULT_HERO='viciado-em-bet',OPEN=['viciado-em-bet','clt-cansado','gato-nada-pra-comer'],id=DEFAULT_HERO;
        try{if(/[?&]sandbox=/.test(location.search))return;var s=JSON.parse(localStorage.getItem('viagem:hero:v1')||'null');if(s&&OPEN.indexOf(s.classId)>=0)id=s.classId;}catch(e){}
        var l=document.createElement('link');l.rel='preload';l.as='image';l.href='/art/lite/menu/danca/'+id+'-p1.webp';l.setAttribute('fetchpriority','high');document.head.appendChild(l);})();
    </script>
    <title>viagem: co-op survival in the browser</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
